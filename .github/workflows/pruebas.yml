name: Pruebas

# Corre en cada cambio subido a GitHub. Si algo falla, GitHub lo marca en rojo.
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de estilo
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas de unidad
        run: npm test
      - name: Permisos de la base de datos (criterio de la Fase 0)
        run: npm run test:db
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Compilación
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pantalla de ingreso en el navegador
        run: npm run e2e
