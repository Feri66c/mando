<!-- Plantilla del correo con el código de ingreso. En Supabase (nube): Authentication → Emails → Magic link. -->
<div style="font-family: Inter, Arial, sans-serif; background:#061428; padding:32px; color:#f7f9fc;">
  <p style="margin:0 0 4px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#b9d3ea;">MANDO · Ingreso</p>
  <h1 style="margin:0 0 16px; font-size:22px;">Tu código para entrar</h1>
  <p style="margin:0 0 8px;">Escríbelo en la app o en la web. Vence en una hora.</p>
  <p style="margin:16px 0; font-family:'IBM Plex Mono', Menlo, monospace; font-size:34px; letter-spacing:.3em; color:#c9a227;">{{ .Token }}</p>
  <p style="margin:24px 0 0; font-size:12px; color:#b9d3ea;">Si no pediste este código, ignora este correo. Nadie de MANDO te lo va a pedir.</p>
</div>
